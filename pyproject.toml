[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-moe"
version = "0.2.0"
description = "Local-first multi-market Mixture-of-Experts research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MarketMoE contributors" }]
dependencies = [
  "ccxt>=4.4",
  "duckdb>=1.1",
  "exchange-calendars>=4.5",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "optuna>=4.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "pyarrow>=17.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "tenacity>=9.0",
  "torch>=2.4",
  "uvicorn[standard]>=0.30",
  "xgboost>=2.1",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
market-moe = "market_moe.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_moe = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "network: tests that access public market-data services",
  "slow: computationally expensive tests",
]
filterwarnings = [
  "ignore:Using .*starlette.testclient.* is deprecated:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["market_moe"]
check_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["market_moe"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
